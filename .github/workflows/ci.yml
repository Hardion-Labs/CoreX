name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & test (Zig 0.17.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check formatting
        run: zig fmt --check src/ build.zig tools/

      - name: Build
        run: zig build

      - name: Test
        run: zig build test --summary all

      - name: Smoke-test the launch contract
        run: |
          ./zig-out/bin/corex-engine --version
          ./zig-out/bin/corex-engine --project examples/hello-project/HelloProject.corex --mode validate
          ./zig-out/bin/corex-engine --project examples/hello-project/HelloProject.corex --headless
          ./zig-out/bin/corex-engine --project examples/hello-project/HelloProject.corex --mode runtime --headless
          # The editor shell renders a real frame of the example project headlessly,
          # with the save marker on, proving the status bar reads a real history.
          zig build editor-frame -- examples/hello-project/HelloProject.corex "$RUNNER_TEMP/editor.qoi" 2 dirty
          # And that frame decodes: the QOI the editor wrote is a valid image.
          zig build qoi-decode -- "$RUNNER_TEMP/editor.qoi" "$RUNNER_TEMP/editor.rgba"
